# Cloud Foundry manifest for both apps. `cf push` from the repo root deploys both together.
#
# Everything below is filled in for this foundation already, except vars.yml (gitignored - see
# step 3). Before pushing, build the frontend with the backend's *actual* route baked in - it's a
# static SPA, so this has to happen before `cf push`, not after:
#
#   1. Decide the backend's route (the `routes:` value below) - it has to be known up front,
#      since the frontend build needs it and CF manifest variables aren't resolved until push
#      time, too late for a static build.
#   2. cd frontend && VITE_API_BASE_URL=https://client-rag-demo-backend.apps.tas-ndc.kuhn-labs.com npm run build
#   3. client-rag-demo-db (postgres) and client-rag-demo-ai (ai-models) already exist (`cf
#      services`) - see the services: comment below for what's still needed before they're
#      actually usable. Their real credentials go in vars.yml (gitignored, not this file - see
#      vars.yml.example for the shape) for CF's ((var)) substitution below.
#   4. cf push --vars-file vars.yml   (from the repo root, using this manifest)
#
# The backend image (docker.image below) is built and published to GHCR by
# .github/workflows/native-image.yaml on every push to main - no local image build needed here.
version: 1
applications:
  - name: client-rag-demo-backend
    docker:
      image: ghcr.io/dmfrey/client-rag-demo:latest
      # GitHub Container Registry packages default to private. If this one hasn't been made
      # public, `cf push` needs registry credentials:
      #   cf push --docker-username <your-github-username>
      # (CF prompts for the password interactively - use a GitHub PAT with read:packages scope,
      # not your account password). Making the package public avoids this entirely.
    memory: 1G
    instances: 1
    routes:
      - route: client-rag-demo-backend.apps.tas-ndc.kuhn-labs.com
    # CF's own health check model doesn't distinguish liveness/readiness the way Kubernetes
    # does (see application.yaml's management.endpoint.health.probes - that split is for a
    # Kubernetes-based platform) - the aggregate endpoint is the right one to point CF at here.
    health-check-type: http
    health-check-http-endpoint: /actuator/health
    env:
      # Activates application-cloud.yaml - cross-origin session cookies (SameSite=None; Secure)
      # and forwarded-headers handling, both required because the frontend and backend are
      # separate routes/origins here, not one shared origin.
      SPRING_PROFILES_ACTIVE: cloud
      # This app doesn't parse VCAP_SERVICES (no java-cfenv/spring-cloud-bindings dependency, and
      # spring-cloud-bindings wouldn't help anyway - confirmed by reading its source, it only
      # reads bindings materialized as files under $SERVICE_BINDING_ROOT/$CNB_BINDINGS, the
      # Kubernetes/Cloud-Native-Buildpacks convention, never VCAP_SERVICES) - binding
      # client-rag-demo-db below makes its credentials visible in VCAP_SERVICES but doesn't
      # configure the datasource from them. Real values come from a service key instead
      # (`cf create-service-key client-rag-demo-db client-rag-demo-db-key`, then
      # `cf service-key client-rag-demo-db client-rag-demo-db-key`) - see vars.yml.example for
      # where they go; never put real credentials directly in this file, it's committed to git.
      SPRING_DATASOURCE_URL: ((db-jdbc-url))
      SPRING_DATASOURCE_USERNAME: ((db-username))
      SPRING_DATASOURCE_PASSWORD: ((db-password))
      # Same story for client-rag-demo-ai (ai-models/tanzu-all-models, an OpenAI-compatible proxy
      # - see build.gradle): `cf create-service-key client-rag-demo-ai client-rag-demo-ai-key`,
      # then `cf service-key client-rag-demo-ai client-rag-demo-ai-key` for
      # credentials.endpoint.openai_api_base / .api_key (already a complete, ready-to-use base
      # URL - no /v1 to append). credentials.endpoint.config_url (GET, bearer auth) lists exactly
      # which models this binding actually grants access to, each tagged CHAT/EMBEDDING/TOOLS/
      # VISION - openai/gpt-oss-120b (CHAT) and nomic-ai/nomic-embed-text-v2-moe (EMBEDDING) are
      # what's configured below, picked from that list and confirmed working end-to-end
      # (including a real embeddings call confirming 768 dimensions, matching vector_store's
      # schema exactly - no migration needed). Neither model name is a secret, unlike the two
      # settings above - only the API key needs to come from vars.yml.
      SPRING_AI_OPENAI_BASE_URL: https://genai-proxy.sys.tas-ndc.kuhn-labs.com/tanzu-all-models-1a56b7a/openai
      SPRING_AI_OPENAI_API_KEY: ((ai-api-key))
      SPRING_AI_OPENAI_CHAT_MODEL: openai/gpt-oss-120b
      SPRING_AI_OPENAI_EMBEDDING_MODEL: nomic-ai/nomic-embed-text-v2-moe
      # nomic-embed-text-v2-moe on this proxy enforces a 512-token limit - well under
      # TokenTextSplitter's 800-token default (application.yaml). TokenTextSplitter's chunkSize
      # is a hard cap under its own tokenizer (jtokkit's CL100K_BASE, an OpenAI/GPT-style BPE
      # encoding - see TokenTextSplitter.doSplit's tokens.subList(0, Math.min(chunkSize, ...))),
      # but this model almost certainly uses a different tokenizer (nomic-embed-text-v2-moe is a
      # BERT-family model, so most likely WordPiece/SentencePiece) - confirmed by a real 400-token
      # (by jtokkit's count) chunk that the *model* rejected as 513+ tokens, a ~28% disagreement.
      # 256 - exactly half the 512 limit - is deliberately not a tight fit around that one
      # observed data point: the actual worst-case disagreement across arbitrary text is unknown,
      # and getting this wrong again costs a full CI + redeploy cycle to discover.
      APP_DOCUMENTS_INGESTION_CHUNK_SIZE: "256"
      # Must match the frontend's actual route below exactly (scheme + host, no trailing slash).
      APP_CORS_ALLOWED_ORIGINS: https://client-rag-demo-frontend.apps.tas-ndc.kuhn-labs.com
    services:
      # postgres/on-demand-postgres-db. This app needs the pgvector extension available
      # (db/changelog/documents/db.changelog-documents-002.yaml runs `CREATE EXTENSION vector`) -
      # this is VMware Tanzu for Postgres, which generally supports it, but that hasn't been
      # confirmed against this specific instance/plan yet - if the Liquibase migration fails on
      # that CREATE EXTENSION step, that's the first thing to check.
      - client-rag-demo-db
      # ai-models/tanzu-all-models - see the SPRING_AI_OPENAI_* comment above.
      - client-rag-demo-ai

  - name: client-rag-demo-frontend
    # Built by `npm run build` (see step 2 above) - not built by CF, just served as-is.
    path: frontend/dist
    buildpacks:
      - staticfile_buildpack
    memory: 64M
    instances: 1
    routes:
      - route: client-rag-demo-frontend.apps.tas-ndc.kuhn-labs.com

  - name: client-rag-demo-sharepoint-batch
    # A Spring Cloud Task app (see SharepointBatchApplication's @EnableTask/CLAUDE.md) - runs
    # sharePointSyncJob once to completion and exits, rather than staying up as a long-lived
    # process. `cf push` here only STAGES the droplet (instances: 0 - it's never actually
    # started as a running app); the job itself is triggered on demand or on a schedule via:
    #   cf run-task client-rag-demo-sharepoint-batch
    # (an external scheduler - e.g. Scheduler for VMware Tanzu, or plain cron calling `cf
    # run-task` - is what decides *when*; this app no longer schedules itself internally, unlike
    # its earlier @Scheduled-based design).
    #
    # Deployed via Docker/GHCR now, same as backend - this app was originally a plain JVM app
    # pushed directly from its bootJar via java_buildpack specifically to avoid the native-image
    # reflection fights backend already documents, but that buildpack's staging path started
    # reproducibly OOM-killing itself (Exit status 137 during the JRE-expansion step, on three
    # separate cells, no clear platform-side resolution timeline) - switched to a GraalVM native
    # image (see sharepoint-batch/build.gradle's bootBuildImage task) to sidestep that staging
    # pipeline entirely, the same way backend already avoids it.
    docker:
      image: ghcr.io/dmfrey/client-rag-demo-sharepoint-batch:latest
      # Same GHCR-visibility note as backend's own entry above - needs
      # `cf push --docker-username <github-username>` (prompts for a GitHub PAT with
      # read:packages) unless the package has been made public.
    memory: 1G
    # Never started as a long-running process - see the note above. `cf run-task` uses the
    # staged droplet directly regardless of this app's own "started"/"stopped" state.
    instances: 0
    no-route: true
    env:
      # Same shared Postgres/genai-service bindings as backend - see its own env: comments above
      # for why real values come from vars.yml rather than VCAP_SERVICES.
      SPRING_DATASOURCE_URL: ((db-jdbc-url))
      SPRING_DATASOURCE_USERNAME: ((db-username))
      SPRING_DATASOURCE_PASSWORD: ((db-password))
      SPRING_AI_OPENAI_BASE_URL: https://genai-proxy.sys.tas-ndc.kuhn-labs.com/tanzu-all-models-1a56b7a/openai
      SPRING_AI_OPENAI_API_KEY: ((ai-api-key))
      SPRING_AI_OPENAI_CHAT_MODEL: openai/gpt-oss-120b
      SPRING_AI_OPENAI_EMBEDDING_MODEL: nomic-ai/nomic-embed-text-v2-moe
      APP_DOCUMENTS_INGESTION_CHUNK_SIZE: "256"
      # Real SharePoint/Graph credentials aren't available yet (see CLAUDE.md) - this deployment
      # exercises the pipeline against a mounted rag-docs-volume (block-storage, bound below)
      # instead, standing in for a real SharePoint drive per the client's own suggestion that an
      # NFS-style mount might substitute for SharePoint in some environments.
      APP_INGESTION_SOURCE: filesystem
      # block-storage's bind schema publishes no bind-time parameters (confirmed via `cf curl
      # /v3/service_plans?service_offering_names=block-storage` - schemas.service_binding.create
      # is empty), so there's no way to request a specific container mount path up front - CF
      # assigns a GUID-based one per binding (/var/vcap/data/<binding-instance-guid>) that can
      # only be read back after binding, from `cf env client-rag-demo-sharepoint-batch`'s
      # VCAP_SERVICES.block-storage[0].volume_mounts[0].container_dir. This placeholder needs
      # replacing with that real value (`cf set-env ... APP_FILESYSTEM_SOURCE_PATH <path>` then
      # `cf restage`) after every fresh bind - it will not work as pushed. A real gap worth fixing
      # (e.g. by having the app read VCAP_SERVICES itself at startup) if this filesystem source
      # becomes more than a one-off test.
      APP_FILESYSTEM_SOURCE_PATH: /var/vcap/data/REPLACE-WITH-ACTUAL-BINDING-GUID-FROM-VCAP-SERVICES
    services:
      - client-rag-demo-db
      - client-rag-demo-ai
      - rag-docs-volume
