name: Deploy to Cloud Foundry

# Triggers right away on every push to main, same as the two build workflows - but the
# `environment: production` gate below (a required-reviewer protection rule, configured on this
# repo's "production" GitHub Environment) pauses the job before it does anything, waiting for a
# human to click Approve in the Actions UI. That approval click is the actual safety gate: by the
# time you approve, you've had a chance to confirm native-image.yaml and sharepoint-batch.yaml
# both finished green, and the job doesn't proceed without an explicit human decision either way.
# workflow_dispatch is also here for an ad-hoc redeploy of the current main without a new push
# (e.g. after a config-only change like a manifest.yml env var, which doesn't trigger either build
# workflow's path filters).
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

# Only one deploy at a time - a second push landing while an approval is still pending should wait
# for the first to finish (or be cancelled by a human), not race it.
concurrency:
  group: deploy-cf
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: cf push (backend, frontend, sharepoint-batch)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      # Reuses frontend-package.yaml's published artifact rather than building from source a
      # second, separate way - guarantees this deploy ships the exact same bundle a client
      # deploying offline would get, and drops the Node/npm setup entirely from this job. That
      # release is rebuilt on every frontend/** push (see frontend-package.yaml) - by the time a
      # human approves this job's environment gate, it's had time to publish the current build,
      # the same reasoning the gate already relies on for the native-image workflows finishing.
      # The bundle ships with a placeholder in place of a real backend URL (see
      # frontend-package.yaml's own comment for why); this sed swap is the same one documented in
      # that release's own notes for a client deploying it themselves.
      - name: Download and prepare frontend bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download frontend-latest --repo ${{ github.repository }} --pattern '*.tar.gz' --output frontend-dist.tar.gz --clobber
          mkdir -p frontend/dist
          tar -xzf frontend-dist.tar.gz -C frontend/dist
          find frontend/dist -name '*.js' -exec sed -i 's|__RUNTIME_API_BASE_URL__|https://client-rag-demo-backend.apps.tas-ndc.kuhn-labs.com|g' {} +

      - name: Install cf CLI
        run: |
          curl -L "https://packages.cloudfoundry.org/stable?release=linux64-binary&version=v8&source=github" -o cf8.tgz
          tar -xzf cf8.tgz cf8
          sudo mv cf8 /usr/local/bin/cf
          cf version

      # Service-account username/password (not a personal SSO login) - `cf` can't do the
      # interactive SSO flow a human uses from a terminal, so CI needs a non-interactive
      # credential. Needs CF_USERNAME/CF_PASSWORD added as repo secrets before this step will
      # succeed.
      - name: Log in to Cloud Foundry
        env:
          CF_API: https://api.sys.tas-ndc.kuhn-labs.com
          CF_ORG: u-daniel-frey-broadcom-com
          CF_SPACE: dev
          CF_USERNAME: ${{ secrets.CF_USERNAME }}
          CF_PASSWORD: ${{ secrets.CF_PASSWORD }}
        run: |
          cf api "$CF_API"
          cf auth "$CF_USERNAME" "$CF_PASSWORD"
          cf target -o "$CF_ORG" -s "$CF_SPACE"

      # Reads the same client-rag-demo-db-key/client-rag-demo-ai-key service keys the manifest.yml
      # header comment already documents for the manual local workflow, rather than duplicating
      # these values as separate GitHub secrets - CF stays the single source of truth, and CI only
      # needs the CF_USERNAME/CF_PASSWORD login above. `cf service-key` prints a "Getting key..."
      # header line before the JSON body; `sed -n '/^{/,$p'` strips it regardless of exact wording.
      # ::add-mask:: registers each value with the Actions runner so it's redacted from all
      # subsequent log output, the same protection secrets.* gets automatically - required here
      # since these values come from `cf service-key`, not the secrets context, so nothing masks
      # them by default.
      - name: Fetch service credentials and write vars file
        run: |
          cf create-service-key client-rag-demo-db client-rag-demo-db-key >/dev/null 2>&1 || true
          cf create-service-key client-rag-demo-ai client-rag-demo-ai-key >/dev/null 2>&1 || true

          DB_JSON=$(cf service-key client-rag-demo-db client-rag-demo-db-key | sed -n '/^{/,$p')
          AI_JSON=$(cf service-key client-rag-demo-ai client-rag-demo-ai-key | sed -n '/^{/,$p')

          DB_JDBC_URL=$(echo "$DB_JSON" | jq -r '.credentials.jdbcUrl')
          DB_USERNAME=$(echo "$DB_JSON" | jq -r '.credentials.user')
          DB_PASSWORD=$(echo "$DB_JSON" | jq -r '.credentials.password')
          AI_API_KEY=$(echo "$AI_JSON" | jq -r '.credentials.endpoint.api_key')

          echo "::add-mask::$DB_JDBC_URL"
          echo "::add-mask::$DB_USERNAME"
          echo "::add-mask::$DB_PASSWORD"
          echo "::add-mask::$AI_API_KEY"

          cat > vars.yml <<VARS_EOF
          db-jdbc-url: "$DB_JDBC_URL"
          db-username: "$DB_USERNAME"
          db-password: "$DB_PASSWORD"
          ai-api-key: "$AI_API_KEY"
          VARS_EOF

      # Pushes all three apps declared in manifest.yml (backend, frontend, sharepoint-batch).
      # sharepoint-batch has instances: 0/no-route: true (see manifest.yml's own comment) - this
      # only stages its droplet, it never starts running, matching its Task-only production shape.
      - name: cf push
        run: cf push --vars-file vars.yml

      - name: Clean up vars file
        if: always()
        run: rm -f vars.yml
