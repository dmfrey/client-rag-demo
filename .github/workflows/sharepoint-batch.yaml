name: Build and Publish SharePoint Batch

on:
  push:
    branches: [ main ]
    # ingestion-core is included since sharepoint-batch depends on it (see
    # sharepoint-batch/build.gradle) - a library-only change still needs a rebuilt jar even
    # though nothing under sharepoint-batch/ itself changed. Same rationale as backend.yaml's.
    paths:
      - 'sharepoint-batch/**'
      - 'ingestion-core/**'
      - '.github/workflows/sharepoint-batch.yaml'
  workflow_dispatch: {}

permissions:
  contents: read
  # Needed to publish the jar to this repo's GitHub Packages Maven registry.
  packages: write

jobs:
  test:
    name: SharePoint batch tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Run sharepoint-batch and ingestion-core tests
        run: ./gradlew :sharepoint-batch:test :ingestion-core:test

  publish-jar:
    name: Publish executable jar to GitHub Packages
    # The jar is the deployable artifact: deploy-cf.yaml builds the same bootJar to cf push, and
    # an offline client downloads this published one (see manifest-offline.yml).
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Publish jar
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # app.ingestion.source (graph or filesystem) is resolved at runtime from the environment,
        # so one jar serves both sources - the old native image had to pick one at build time.
        # --no-configuration-cache: see backend.yaml's publish-jar job for why.
        run: ./gradlew :sharepoint-batch:publish --no-configuration-cache
