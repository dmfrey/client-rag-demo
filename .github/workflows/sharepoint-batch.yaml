name: Build and Publish SharePoint Batch Image

on:
  push:
    branches: [ main ]
    # ingestion-core is included since sharepoint-batch depends on it (see
    # sharepoint-batch/build.gradle) - a library-only change still needs a rebuilt image even
    # though nothing under sharepoint-batch/ itself changed. Mirrors native-image.yaml's same
    # rationale for backend.
    paths:
      - 'sharepoint-batch/**'
      - 'ingestion-core/**'
      - '.github/workflows/sharepoint-batch.yaml'
  workflow_dispatch: {}

permissions:
  contents: read
  # Needed to push the built image to GHCR under this repo.
  packages: write

jobs:
  test:
    name: SharePoint batch tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Run sharepoint-batch and ingestion-core tests
        run: ./gradlew :sharepoint-batch:test :ingestion-core:test

  publish-image:
    name: Build and publish image
    needs: test
    runs-on: ubuntu-latest
    # A plain JVM Cloud Native Buildpacks build (no BP_NATIVE_IMAGE, unlike backend's
    # native-image.yaml) - no native-image analysis phase, so none of that workflow's
    # memory/timeout tuning applies here. Default timeout is plenty.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        run: |
          ./gradlew :sharepoint-batch:bootBuildImage \
            --imageName=ghcr.io/${{ github.repository }}-sharepoint-batch:latest \
            --publishImage
