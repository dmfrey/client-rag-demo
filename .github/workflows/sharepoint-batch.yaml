name: Build and Publish SharePoint Batch Image

on:
  push:
    branches: [ main ]
    # ingestion-core is included since sharepoint-batch depends on it (see
    # sharepoint-batch/build.gradle) - a library-only change still needs a rebuilt image even
    # though nothing under sharepoint-batch/ itself changed. Mirrors native-image.yaml's same
    # rationale for backend.
    paths:
      - 'sharepoint-batch/**'
      - 'ingestion-core/**'
      - '.github/workflows/sharepoint-batch.yaml'
  workflow_dispatch: {}

permissions:
  contents: read
  # Needed to push the built image to GHCR under this repo.
  packages: write

jobs:
  test:
    name: SharePoint batch tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Run sharepoint-batch and ingestion-core tests
        run: ./gradlew :sharepoint-batch:test :ingestion-core:test

  publish-image:
    name: Build and publish native image
    needs: test
    runs-on: ubuntu-latest
    # Native image now (see sharepoint-batch/build.gradle's bootBuildImage comment for why) -
    # mirrors native-image.yaml's timeout budget for backend's own native-image build, since this
    # app pulls in the same Tika/POI/XMLBeans reflection surface via ingestion-core and needs the
    # same points-to-analysis memory/time tradeoffs (-H:NumberOfThreads=1, see build.gradle).
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        # APP_INGESTION_SOURCE=filesystem here, not just at deploy time: bootBuildImage runs
        # Spring AOT processing (processAot/compileAotJava) as part of this same Gradle
        # invocation, and a real deploy confirmed that @ConditionalOnProperty-gated beans in
        # ordinary application @Configuration classes (SharePointConfiguration's
        # GraphServiceClient bean, GraphChangedItemsAdapter/GraphItemDownloadAdapter - see
        # IngestionSourceProperties) get resolved once during THIS AOT processing and baked
        # permanently into the native image, not re-evaluated from the environment at container
        # startup the way a plain JVM app would. Deploying with `cf set-env
        # APP_FILESYSTEM_SOURCE_PATH ...` alone still left the Graph beans wired in and crashing
        # on missing Graph credentials, because the image had been built with this property
        # unset (defaulting to "graph" - see IngestionSourceProperties' matchIfMissing=true).
        # This means: switching this app to the "graph" source later requires rebuilding the
        # native image with this env var set to "graph" (or removed), not just a redeploy - a
        # real, now-documented constraint of shipping conditional multi-mode config as a single
        # native image, unlike backend's plain-JVM-at-buildpack-time flexibility.
        env:
          APP_INGESTION_SOURCE: filesystem
        run: |
          ./gradlew :sharepoint-batch:bootBuildImage \
            --imageName=ghcr.io/${{ github.repository }}-sharepoint-batch:latest \
            --publishImage

  publish-jar:
    name: Publish executable jar to GitHub Packages
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Publish jar
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # No APP_INGESTION_SOURCE override here (unlike the native-image job above): AOT-generated
        # code is only actually used at runtime under -Dspring.aot.enabled=true, which a plain
        # `java -jar` run doesn't set by default - the @ConditionalOnProperty-baked-at-build-time
        # constraint documented on the native-image job is specific to native images, where using
        # the AOT initializer isn't optional. This jar still resolves app.ingestion.source
        # dynamically from the environment at actual startup.
        # --no-configuration-cache: see native-image.yaml's publish-jar job for why.
        run: ./gradlew :sharepoint-batch:publish --no-configuration-cache
