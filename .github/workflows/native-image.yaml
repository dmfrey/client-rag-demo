name: Build and Publish Native Image

on:
  push:
    branches: [ main ]
    # Only backend changes (or changes to this workflow itself) need a rebuild - frontend/docs/
    # manifest-only pushes used to also trigger a full native-image build for no reason, wasting
    # CI time on an image that ends up byte-identical to the one already published. ingestion-core
    # is included too - backend depends on it (see backend/build.gradle), so a library-only change
    # there still needs a rebuilt backend image even though nothing under backend/ itself changed.
    paths:
      - 'backend/**'
      - 'ingestion-core/**'
      - '.github/workflows/native-image.yaml'
  workflow_dispatch: {}

permissions:
  contents: read
  # Needed to push the built image to GHCR under this repo.
  packages: write

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Run backend and ingestion-core tests
        run: ./gradlew :backend:test :ingestion-core:test

  publish-native-image:
    name: Build and publish native image
    needs: test
    runs-on: ubuntu-latest
    # Native-image compilation is slow (Tika/PDFBox/POI + Liquibase + Spring AI pull in a large
    # reflective surface) - the default 6h timeout is needlessly generous for a genuine hang.
    # 30 was too tight once OpenAiRuntimeHints/PoiRuntimeHints started registering thousands of
    # classes across com.openai.models and org.openxmlformats.schemas for reflection - a real run
    # hit "exceeded the maximum execution time of 30m0s" on the native-image step alone (backend
    # tests, a separate job, took under 4 minutes). 45 stopped being enough too - a real run of
    # this exact job ran 13:26:12->14:11:30 (45m18s) and GitHub reported it as "cancelled" rather
    # than a timeout failure, which is just how a timeout-triggered kill shows up in the API/UI -
    # worth remembering next time this recurs, since "cancelled" looks like external interference
    # otherwise. 60 itself then wasn't enough memory (not time) - two runs failed with a real
    # OutOfMemoryError/exit-status-30 during native-image's points-to analysis, needing more than
    # the runner's ~12.7GB allocation. Fixed by forcing single-threaded analysis
    # (-H:NumberOfThreads=1 in backend/build.gradle's bootBuildImage args) to trade build time for
    # materially lower peak memory - bumped to 90 minutes here to give that slower, single-threaded
    # analysis phase room to actually finish rather than getting cut off mid-build.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # bootBuildImage runs the actual native-image compilation inside Paketo's Linux builder
      # container via Cloud Native Buildpacks (BP_NATIVE_IMAGE=true, set in backend/build.gradle)
      # - the runner's own JDK just orchestrates Gradle/AOT processing, it doesn't need GraalVM
      # itself.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish native image
        run: |
          ./gradlew :backend:bootBuildImage \
            --imageName=ghcr.io/${{ github.repository }}:latest \
            --publishImage

  publish-jar:
    name: Publish executable jar to GitHub Packages
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Publish jar
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --no-configuration-cache: maven-publish's GenerateMavenPom task can't serialize into the
        # configuration cache this project otherwise uses by default (Configuration/Project/
        # DependencyHandler aren't cache-safe types, per Gradle's own requirements doc) - confirmed
        # locally, the task itself succeeds and produces a correct POM either way, only the cache
        # write fails and turns that into a false BUILD FAILED.
        run: ./gradlew :backend:publish --no-configuration-cache
