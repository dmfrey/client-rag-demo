# OFFLINE variant of manifest.yml: deploys the backend and sharepoint-batch as plain executable
# jars (Java buildpack) instead of pulling Docker images from GHCR, and the frontend from its
# pre-built bundle. For a CF foundation/network with no access to ghcr.io or npm.
#
# Expected layout next to this file (latest GitHub Packages SNAPSHOT file names - they change on each publish; update `path:` below):
#
#   manifest-offline.yml
#   client-rag-demo-backend-0.0.1-20260825.162146-1.jar        (GitHub Packages: com.example:client-rag-demo-backend)
#   client-rag-demo-sharepoint-batch-0.0.1-20260825.162031-1.jar
#   frontend-dist/                                    (extracted frontend-dist.tar.gz from the frontend-latest release, with
#                                                      __RUNTIME_API_BASE_URL__ already sed-replaced
#                                                      by the backend's real route - see the
#                                                      frontend app below)
#
# Then: cf push -f manifest-offline.yml
#
# There is no vars.yml: both Java apps read Postgres and their model endpoint from their service
# bindings (java-cfenv). The services must exist first - see README.md, "Foundation prerequisites".
#
# Prerequisites on the (offline) foundation:
#   - an offline-capable Java buildpack that bundles a Java 25 JRE (the jars are built for 25).
#     Written as `java_buildpack_offline`, which is what the original foundation calls it - check
#     `cf buildpacks` on yours and change the `buildpacks:` entries of the two Java apps below if it differs.
#   - staticfile_buildpack.
version: 1
applications:
  - name: client-rag-demo-backend
    path: ./client-rag-demo-backend-0.0.1-20260825.162146-1.jar
    buildpacks:
      - java_buildpack_offline
    memory: 1500M  # JVM, not the old native image
    instances: 1
    routes:
      - route: client-rag-demo-backend.apps.tas-ndc.kuhn-labs.com
    # CF's own health check model doesn't distinguish liveness/readiness the way Kubernetes
    # does (see application.yaml's management.endpoint.health.probes - that split is for a
    # Kubernetes-based platform) - the aggregate endpoint is the right one to point CF at here.
    health-check-type: http
    health-check-http-endpoint: /actuator/health
    # A JVM start (Liquibase migrations included) is slower than the old native image's.
    timeout: 180
    env:
      # Activates application-cloud.yaml - cross-origin session cookies (SameSite=None; Secure)
      # and forwarded-headers handling, both required because the frontend and backend are
      # separate routes/origins here, not one shared origin.
      SPRING_PROFILES_ACTIVE: cloud
      # Postgres and the GenAI proxy come from the bound services, not from env vars: the jar
      # bundles java-cfenv-boot (sets spring.datasource.* from the client-rag-demo-db binding)
      # and GenaiModelConfiguration reads the two GenAI services' endpoints from their bindings
      # (see services: below). Nothing here needs a service key or vars.yml.
      #
      # The buildpack would otherwise add its own copy of java-cfenv-boot next to the one in the
      # jar and activate a `cloud` profile of its own - disabled so there's exactly one.
      JBP_CONFIG_JAVA_CF_ENV: '{enabled: false}'
      # The jar targets Java 25.
      JBP_CONFIG_OPEN_JDK_JRE: '{ jre: { version: 25.+ } }'
      # Which model is used is decided by which GenAI service is bound, not by a name here: the
      # chat model is the one client-rag-demo-chat grants and the embedding model the one
      # client-rag-demo-embed grants (single-model plans - see services: below). The service names
      # default to those two in application-cloud.yaml; if yours are named differently set
      #   APP_GENAI_CHAT_SERVICE / APP_GENAI_EMBEDDING_SERVICE
      # A service on an all-models plan is rejected as ambiguous at startup unless
      #   APP_GENAI_CHAT_MODEL / APP_GENAI_EMBEDDING_MODEL
      # name the model to use. At startup the embedding model's dimension is also checked against
      # vector_store.embedding (768, fixed by the Liquibase schema) and a mismatch stops the app.
      # nomic-embed-text-v2-moe on this proxy enforces a 512-token limit - well under
      # TokenTextSplitter's 800-token default (application.yaml). TokenTextSplitter's chunkSize
      # is a hard cap under its own tokenizer (jtokkit's CL100K_BASE, an OpenAI/GPT-style BPE
      # encoding - see TokenTextSplitter.doSplit's tokens.subList(0, Math.min(chunkSize, ...))),
      # but this model almost certainly uses a different tokenizer (nomic-embed-text-v2-moe is a
      # BERT-family model, so most likely WordPiece/SentencePiece). First observed as a ~28%
      # disagreement (a 400-jtokkit-token chunk the model rejected as 513+), which is what set the
      # original 256 value (exactly half the 512 limit). A real sharepoint-batch run against the
      # client's document corpus then hit the same overflow on 2 documents *at* chunkSize=256 -
      # roughly a 2x disagreement, not 28%, on whatever those documents' specific content is
      # (tables/unusual formatting/non-English text tokenize very differently between BPE and
      # WordPiece/SentencePiece). No value here is a guaranteed fix against an unknown worst case,
      # only lower-probability - 128 gives ~4x margin even assuming that same 2x disagreement
      # repeats. If a document still overflows at this size, that document's content is
      # pathological enough to need its own investigation, not another blanket chunkSize drop.
      APP_DOCUMENTS_INGESTION_CHUNK_SIZE: "128"
      # Must match the frontend's actual route below exactly (scheme + host, no trailing slash).
      APP_CORS_ALLOWED_ORIGINS: https://client-rag-demo-frontend.apps.tas-ndc.kuhn-labs.com
    services:
      # postgres/on-demand-postgres-db. This app needs the pgvector extension available
      # (db/changelog/documents/db.changelog-documents-002.yaml runs `CREATE EXTENSION vector`) -
      # this is VMware Tanzu for Postgres, which generally supports it, but that hasn't been
      # confirmed against this specific instance/plan yet - if the Liquibase migration fails on
      # that CREATE EXTENSION step, that's the first thing to check.
      - client-rag-demo-db
      # Two ai-models services, each on a single-model plan, so each one's model is explicit:
      #   cf create-service ai-models tanzu-gpt-oss-120b client-rag-demo-chat       (CHAT)
      #   cf create-service ai-models tanzu-nomic-embed-text-v2 client-rag-demo-embed   (EMBEDDING)
      # Their endpoints and API keys come from these bindings (java-cfenv), not from vars.yml.
      - client-rag-demo-chat
      - client-rag-demo-embed

  - name: client-rag-demo-frontend
    # Pre-built static bundle (extracted frontend-dist.tar.gz from the frontend-latest release), served as-is. Before
    # pushing, point it at the real backend route:
    #   grep -rl __RUNTIME_API_BASE_URL__ frontend-dist | xargs sed -i 's|__RUNTIME_API_BASE_URL__|https://client-rag-demo-backend.apps.tas-ndc.kuhn-labs.com|g'
    # (use `sed -i ''` on macOS). No Node/npm needed.
    path: ./frontend-dist
    buildpacks:
      - staticfile_buildpack
    memory: 64M
    instances: 1
    routes:
      - route: client-rag-demo-frontend.apps.tas-ndc.kuhn-labs.com

  - name: client-rag-demo-sharepoint-batch
    # A Spring Cloud Task app (see SharepointBatchApplication's @EnableTask/CLAUDE.md) - runs
    # sharePointSyncJob once to completion and exits, rather than staying up as a long-lived
    # process. `cf push` here only STAGES the droplet (instances: 0 - it's never actually
    # started as a running app); the job itself is triggered on demand or on a schedule via:
    #   cf run-task client-rag-demo-sharepoint-batch
    # (an external scheduler - e.g. Scheduler for VMware Tanzu, or plain cron calling `cf
    # run-task` - is what decides *when*; this app no longer schedules itself internally, unlike
    # its earlier @Scheduled-based design).
    #
    # Plain executable jar via java_buildpack_offline (no Docker/GHCR access offline).
    path: ./client-rag-demo-sharepoint-batch-0.0.1-20260825.162031-1.jar
    buildpacks:
      - java_buildpack_offline
    # Used by `cf run-task` too (a task defaults to the app's memory). Document parsing (Tika/POI/
    # PDFBox) on a JVM wants headroom - same size as the backend.
    memory: 1500M
    # Never started as a long-running process - see the note above. `cf run-task` uses the
    # staged droplet directly regardless of this app's own "started"/"stopped" state.
    instances: 0
    no-route: true
    env:
      # Activates application-cloud.yaml: the embedding model comes from the bound
      # client-rag-demo-embed service (ingestion-core's GenaiBindingsConfiguration), and Postgres
      # from client-rag-demo-db (java-cfenv-boot, bundled in the jar) - no vars.yml involved. This
      # app only embeds documents (no chat), so it is bound to the embedding service alone. If that
      # service is named differently, set APP_GENAI_EMBEDDING_SERVICE; an all-models plan is
      # rejected as ambiguous at startup unless APP_GENAI_EMBEDDING_MODEL names the model. At
      # startup the model's dimension is also checked against vector_store.embedding (768, fixed by
      # the Liquibase schema backend runs) and a mismatch stops the task before it ingests anything.
      SPRING_PROFILES_ACTIVE: cloud
      # The buildpack would otherwise add its own copy of java-cfenv-boot next to the one in the
      # jar and activate a `cloud` profile of its own - disabled so there's exactly one. (It also
      # broke @EnableJdbcRepositories outright on the first java_buildpack deploy - see CLAUDE.md.)
      JBP_CONFIG_JAVA_CF_ENV: '{enabled: false}'
      # The jar targets Java 25.
      JBP_CONFIG_OPEN_JDK_JRE: '{ jre: { version: 25.+ } }'
      # Kept in sync with the backend app's own APP_DOCUMENTS_INGESTION_CHUNK_SIZE above - see its
      # comment for why this is 128, not the original 256.
      APP_DOCUMENTS_INGESTION_CHUNK_SIZE: "128"
      # Real SharePoint/Graph credentials aren't available yet (see CLAUDE.md) - this deployment
      # exercises the pipeline against a mounted rag-docs-volume (block-storage, bound below)
      # instead, standing in for a real SharePoint drive per the client's own suggestion that an
      # NFS-style mount might substitute for SharePoint in some environments. A plain JVM jar picks
      # the source at runtime from this variable (the old native image baked it in at build time).
      APP_INGESTION_SOURCE: filesystem
      # block-storage's bind schema publishes no bind-time parameters (confirmed via `cf curl
      # /v3/service_plans?service_offering_names=block-storage` - schemas.service_binding.create
      # is empty), so there's no way to request a specific container mount path up front - CF
      # assigns a GUID-based one per binding (/var/vcap/data/<binding-instance-guid>) that can
      # only be read back after binding, from `cf env client-rag-demo-sharepoint-batch`'s
      # VCAP_SERVICES.block-storage[0].volume_mounts[0].container_dir. This placeholder needs
      # replacing with that real value (`cf set-env ... APP_FILESYSTEM_SOURCE_PATH <path>` then
      # `cf restage`) after every fresh bind - it will not work as pushed. A real gap worth fixing
      # now that java-cfenv is on the classpath: the app could read the mount path from its own
      # VCAP_SERVICES instead.
      APP_FILESYSTEM_SOURCE_PATH: /var/vcap/data/REPLACE-WITH-ACTUAL-BINDING-GUID-FROM-VCAP-SERVICES
    services:
      - client-rag-demo-db
      - client-rag-demo-embed
      - rag-docs-volume
