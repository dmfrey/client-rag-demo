server:
  # Cloud Foundry's Gorouter terminates TLS and forwards X-Forwarded-* headers to the app, which
  # runs plain HTTP internally - without this, Spring never sees the request as secure (wrong
  # scheme in any URL it builds, and would undermine the cookie.secure setting below if that were
  # left to auto-detect from request.isSecure() instead of being forced).
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        # The frontend and backend are deployed as separate CF routes/origins (see manifest.yml),
        # not behind one shared origin - session cookies are therefore genuinely cross-site from
        # the browser's perspective. SameSite=None is required for the browser to send the cookie
        # on those cross-origin fetch() calls at all (Lax, the default, blocks it), and browsers
        # reject SameSite=None outright unless Secure is also set - true unconditionally rather
        # than derived, since Gorouter's TLS termination always makes this true in practice.
        same-site: none
        secure: true

# On Cloud Foundry the chat and embedding models come from two bound GenAI services, selected by
# GenaiModelConfiguration (app.genai.*) rather than from spring.ai.openai.* autoconfiguration - so
# every OpenAI autoconfig is switched off. Besides the two models, the unused audio/image/moderation
# ones would otherwise fail startup demanding an API key that nothing sets.
app:
  genai:
    # Service instance names as bound in manifest.yml (override with APP_GENAI_CHAT_SERVICE /
    # APP_GENAI_EMBEDDING_SERVICE if yours are named differently). Each service is normally on a
    # single-model plan; app.genai.chat-model / embedding-model are only needed to pick one model
    # out of an all-models plan.
    chat-service: client-rag-demo-chat
    embedding-service: client-rag-demo-embed

spring:
  autoconfigure:
    exclude:
      # java-cfenv-boot-tanzu-genai's own locator is one bean for one genai.locator.* property set,
      # which can't represent two services - GenaiModelConfiguration builds one locator per service.
      - io.pivotal.cfenv.boot.genai.GenaiLocatorAutoConfiguration
  ai:
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
