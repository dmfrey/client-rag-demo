databaseChangeLog:
  - changeSet:
      id: users-002-add-profile-fields-to-users
      author: dfrey
      changes:
        - addColumn:
            tableName: users
            columns:
              - column:
                  name: first_name
                  type: varchar(255)
              - column:
                  name: last_name
                  type: varchar(255)
              - column:
                  name: email
                  type: varchar(255)
