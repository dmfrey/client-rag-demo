databaseChangeLog:
  - changeSet:
      id: documents-001-create-documents-table
      author: dfrey
      changes:
        - createTable:
            tableName: documents
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: filename
                  type: varchar(1024)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uc_documents_filename
              - column:
                  name: content_type
                  type: varchar(16)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(16)
                  constraints:
                    nullable: false
              - column:
                  name: error_message
                  type: text
              - column:
                  name: chunk_count
                  type: int
              - column:
                  name: uploaded_by
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
