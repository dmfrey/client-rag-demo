databaseChangeLog:
  - changeSet:
      id: documents-002-create-vector-store
      author: dfrey
      comment: >
        Schema for Spring AI's PgVectorStore (spring.ai.vectorstore.pgvector.initialize-schema is
        false - Liquibase owns this table, not PgVectorStore itself). Column shapes and defaults
        must match exactly what PgVectorStore's runtime queries expect. embedding vector(768)
        matches nomic-embed-text's output dimension (see application.yaml) - changing embedding
        models later means a migration plus a full reindex of every document.
      changes:
        - sql:
            sql: CREATE EXTENSION IF NOT EXISTS vector
        - sql:
            sql: CREATE EXTENSION IF NOT EXISTS hstore
        - sql:
            sql: CREATE EXTENSION IF NOT EXISTS "uuid-ossp"
        - sql:
            sql: |
              CREATE TABLE IF NOT EXISTS vector_store (
                  id uuid DEFAULT uuid_generate_v4() PRIMARY KEY,
                  content text,
                  metadata json,
                  embedding vector(768)
              )
        - sql:
            sql: CREATE INDEX IF NOT EXISTS spring_ai_vector_index ON vector_store USING hnsw (embedding vector_cosine_ops)
