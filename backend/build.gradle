plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'jacoco'
	id 'org.graalvm.buildtools.native' version '1.1.10'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

ext {
	set('datasourceMicrometerVersion', "2.2.1")
	set('springAiVersion', "2.0.1")
}

dependencies {

	// Spring Boot dependencies
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-liquibase'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'

	// Spring AI dependencies
	// tika-document-reader's transitive tika-parsers-standard-package covers PDF and Microsoft
	// Office parsing on its own (Tika bundles Apache PDFBox and POI), so this is the one reader
	// used for every accepted document type (PDF, DOCX, TXT) - no separate PDF-specific reader.
	implementation 'org.springframework.ai:spring-ai-tika-document-reader'
	implementation 'org.springframework.ai:spring-ai-starter-model-chat-memory-repository-jdbc'
	// OpenAI-compatible client rather than Ollama's native one - used everywhere (local dev,
	// tests, production), just pointed at a different OpenAI-compatible endpoint per
	// environment: Ollama exposes one at /v1 alongside its native API, and that's what this
	// points at locally/in tests (see TestcontainersConfiguration, application-local.yaml);
	// production points at Tanzu Platform's genai-service marketplace proxy (see manifest.yml).
	implementation 'org.springframework.ai:spring-ai-starter-model-openai'
	implementation 'org.springframework.ai:spring-ai-starter-vector-store-pgvector'
	implementation 'org.springframework.ai:spring-ai-vector-store-advisor'

	// Observability dependencies
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

	// org.eclipse.angus:angus-activation (pulled in transitively via jaxb-core, used by
	// Tika/POI for XML/OOXML parsing) registers a GraalVM native-image Feature
	// (AngusActivationFeature) that unconditionally references jakarta.mail.Part - without this
	// API on the classpath, native-image generation fails with NoClassDefFoundError even though
	// the app never sends or parses email. Just the API is needed to satisfy the class lookup;
	// no implementation/runtime mail functionality is used.
	runtimeOnly 'jakarta.mail:jakarta.mail-api:2.1.3'

	// Database dependencies
	implementation 'org.postgresql:postgresql'

	// Developer Tools
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'

	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

	// Test dependencies
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jdbc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-liquibase-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	// TestRestTemplate lives here as of Boot 4.1's client-module split, not in spring-boot-test.
	testImplementation 'org.springframework.boot:spring-boot-resttestclient'

	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.springframework.ai:spring-ai-spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-ollama'
	testImplementation 'org.testcontainers:testcontainers-postgresql'

	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

}

dependencyManagement {
	imports {
		mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()

	// Testcontainers 2.x reads TESTCONTAINERS_RYUK_DISABLED directly from the environment
	// (ResourceReaper.instance()) - the classic ryuk.disabled properties-file key no longer
	// has any effect. Ryuk's privileged reaper container can't run under rootless Podman, so
	// it's disabled here for every developer rather than relying on shell environment setup.
	environment 'TESTCONTAINERS_RYUK_DISABLED', 'true'

	finalizedBy jacocoTestReport
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
	}
}

tasks.named('bootBuildImage') {
	imageName = "ghcr.io/dmfrey/client-rag-demo:${project.version}"
	// Paketo's native-image builder (Linux-based, unlike a locally-invoked native-image binary)
	// is also how the CI workflow builds the published image - building it locally the same way
	// exercises the exact same path this app will actually run under in production.
	environment = [
		'BP_NATIVE_IMAGE': 'true',
		// GraalVM only bundles a minimal charset set by default (no CP1252/Windows-1252) - Apache
		// POI's LocaleUtil has a static initializer that loads CP1252 unconditionally to parse any
		// OOXML file (DOCX/XLSX/PPTX), with no fallback/catch around it (unlike PDFBox's own
		// Windows-1252 lookup elsewhere, which does catch and fall back) - so an uncaught
		// ExceptionInInitializerError there doesn't just fail one document, it permanently breaks
		// LocaleUtil (and therefore every DOCX upload) for the running instance's whole lifetime,
		// discovered only by a real .docx upload in production. -H:+AddAllCharsets is the current,
		// non-deprecated flag (confirmed via `native-image --expert-options-all`) for including
		// every hosted charset rather than registering CP1252 alone and re-discovering the next
		// missing one whenever some other document's encoding differs.
		// Apache XMLBeans (used by POI's XWPF/Word parsing specifically - the class chain is
		// XWPFDocument -> POIXMLDocument.load -> an XMLBeans-generated schema class's <clinit> ->
		// its regex engine's locale setup) loads a ResourceBundle of error-message strings that
		// GraalVM doesn't include by default either - a genuinely different native-image gap from
		// the charset one above (ResourceBundle inclusion, not Charset provider inclusion),
		// discovered only by a real .docx upload crashing with MissingResourceException. Only this
		// one exact bundle is registered since it's the only one actually observed failing - add
		// more here (comma-separated per -H:IncludeResourceBundles) if another one surfaces.
		'BP_NATIVE_IMAGE_BUILD_ARGUMENTS': '-H:+AddAllCharsets -H:IncludeResourceBundles=org.apache.xmlbeans.impl.regex.message',
	]
}
